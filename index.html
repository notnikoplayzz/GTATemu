<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GTA Style 3D Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }
        #instructions {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            background: rgba(0,0,0,0.5);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }

        /* Mobil UI */
        .mobile-controls {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        /* Joystick Stânga */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: auto;
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Zona de privit / roti camera (dreapta ecranului) */
        #touch-look-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            pointer-events: auto;
        }

        /* Butoane acțiune */
        .action-buttons {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: auto;
        }
        .btn {
            width: 65px;
            height: 65px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #fff;
            color: #fff;
            border-radius: 50%;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            active {
                background: rgba(255, 255, 255, 0.4);
            }
        }
        #btn-car {
            background: rgba(230, 126, 34, 0.8);
            display: none;
        }
        #btn-jump {
            background: rgba(46, 204, 113, 0.8);
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <h2>GTA TEMU 3D</h2>
            <p id="status-text">Stare: Pe picioare</p>
        </div>
        <div id="instructions">
            <b>PC:</b> WASD / Săgeți = Mers<br>
            Mouse = Privire (Click pentru Lock)<br>
            Space = Săritură | F / E = Intrare/Ieșire mașină<br><br>
            <b>Mobil:</b> Joystick stânga + Trage pe ecran în dreapta
        </div>

        <!-- Interfață Mobil -->
        <div class="mobile-controls" id="mobile-ui">
            <div id="joystick-zone">
                <div id="joystick-knob"></div>
            </div>
            <div id="touch-look-zone"></div>
            <div class="action-buttons">
                <div class="btn" id="btn-car">CAR</div>
                <div class="btn" id="btn-jump">JUMP</div>
            </div>
        </div>
    </div>

    <script>
        // --- Detectare Dispozitiv Mobil ---
        const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        if (isMobile) {
            document.getElementById('mobile-ui').style.display = 'block';
        }

        // --- Inițializare Scenă Three.js ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Cer albastru
        scene.fog = new THREE.Fog(0x87ceeb, 20, 150);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('game-container').appendChild(renderer.domElement);

        // Lumini
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- Mediu / Oraș ---
        // Șosea / Pământ
        const floorGeo = new THREE.PlaneGeometry(300, 300);
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Clădiri decorative
        for (let i = 0; i < 30; i++) {
            const h = 10 + Math.random() * 30;
            const bGeo = new THREE.BoxGeometry(12, h, 12);
            const bMat = new THREE.MeshLambertMaterial({ color: Math.random() * 0xffffff });
            const b = new THREE.Mesh(bGeo, bMat);
            b.position.set((Math.random() - 0.5) * 220, h / 2, (Math.random() - 0.5) * 220);
            // Evită centrul
            if (b.position.distanceTo(new THREE.Vector3(0, 0, 0)) > 25) {
                b.castShadow = true;
                b.receiveShadow = true;
                scene.add(b);
            }
        }

        // --- Jucător (Caracter 3D) ---
        const playerGroup = new THREE.Group();
        const pBodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.8);
        const pBodyMat = new THREE.MeshLambertMaterial({ color: 0x3498db });
        const pBody = new THREE.Mesh(pBodyGeo, pBodyMat);
        pBody.position.y = 0.9;
        pBody.castShadow = true;
        playerGroup.add(pBody);

        const pHeadGeo = new THREE.SphereGeometry(0.4);
        const pHeadMat = new THREE.MeshLambertMaterial({ color: 0xffe0bd });
        const pHead = new THREE.Mesh(pHeadGeo, pHeadMat);
        pHead.position.y = 2.0;
        playerGroup.add(pHead);

        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);

        // --- Mașină 3D ---
        const carGroup = new THREE.Group();
        const carBodyGeo = new THREE.BoxGeometry(2.2, 1.2, 4.5);
        const carBodyMat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });
        const carBody = new THREE.Mesh(carBodyGeo, carBodyMat);
        carBody.position.y = 0.8;
        carBody.castShadow = true;
        carGroup.add(carBody);

        // Roți
        const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
        const wheelMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
        const wheelPositions = [
            [-1.1, 0.4, 1.4], [1.1, 0.4, 1.4],
            [-1.1, 0.4, -1.4], [1.1, 0.4, -1.4]
        ];
        wheelPositions.forEach(pos => {
            const w = new THREE.Mesh(wheelGeo, wheelMat);
            w.rotation.z = Math.PI / 2;
            w.position.set(...pos);
            carGroup.add(w);
        });

        carGroup.position.set(8, 0, 5);
        scene.add(carGroup);

        // --- Stare Joc & Fizică ---
        let inCar = false;
        let playerVelY = 0;
        let isGrounded = true;
        let carSpeed = 0;
        const keys = {};

        // Rotație cameră (Yaw / Pitch)
        let cameraYaw = 0;
        let cameraPitch = 0.2;

        // Vectori mișcare mobil
        let moveForward = 0;
        let moveSide = 0;

        // --- Input Tastatură (PC) ---
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if ((e.code === 'KeyF' || e.code === 'KeyE')) toggleCar();
            if (e.code === 'Space' && !inCar && isGrounded) {
                playerVelY = 0.2;
                isGrounded = false;
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        // --- Pointer Lock (PC Control Mouse) ---
        renderer.domElement.addEventListener('click', () => {
            if (!isMobile) renderer.domElement.requestPointerLock();
        });
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement === renderer.domElement) {
                cameraYaw -= e.movementX * 0.003;
                cameraPitch += e.movementY * 0.003;
                cameraPitch = Math.max(-0.2, Math.min(1.2, cameraPitch));
            }
        });

        // --- Touch Controls (Mobil) ---
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        const touchLookZone = document.getElementById('touch-look-zone');
        const btnCar = document.getElementById('btn-car');
        const btnJump = document.getElementById('btn-jump');

        let joyTouchId = null;
        let joyCenter = { x: 0, y: 0 };

        joystickZone.addEventListener('touchstart', e => {
            for (let touch of e.changedTouches) {
                if (joyTouchId === null) {
                    joyTouchId = touch.identifier;
                    const rect = joystickZone.getBoundingClientRect();
                    joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                    updateJoystick(touch);
                }
            }
        });

        joystickZone.addEventListener('touchmove', e => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === joyTouchId) {
                    updateJoystick(touch);
                }
            }
        });

        const resetJoystick = () => {
            joyTouchId = null;
            joystickKnob.style.left = '35px';
            joystickKnob.style.top = '35px';
            moveForward = 0;
            moveSide = 0;
        };

        joystickZone.addEventListener('touchend', resetJoystick);
        joystickZone.addEventListener('touchcancel', resetJoystick);

        function updateJoystick(touch) {
            const dx = touch.clientX - joyCenter.x;
            const dy = touch.clientY - joyCenter.y;
            const dist = Math.min(Math.hypot(dx, dy), 45);
            const angle = Math.atan2(dy, dx);

            const knobX = Math.cos(angle) * dist + 35;
            const knobY = Math.sin(angle) * dist + 35;
            joystickKnob.style.left = `${knobX}px`;
            joystickKnob.style.top = `${knobY}px`;

            moveSide = (dx / 45);
            moveForward = -(dy / 45);
        }

        // Touch Look (Rotiți camera în dreapta)
        let lookTouchId = null;
        let lastTouchX = 0, lastTouchY = 0;

        touchLookZone.addEventListener('touchstart', e => {
            for (let touch of e.changedTouches) {
                if (lookTouchId === null) {
                    lookTouchId = touch.identifier;
                    lastTouchX = touch.clientX;
                    lastTouchY = touch.clientY;
                }
            }
        });

        touchLookZone.addEventListener('touchmove', e => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === lookTouchId) {
                    const dx = touch.clientX - lastTouchX;
                    const dy = touch.clientY - lastTouchY;
                    cameraYaw -= dx * 0.005;
                    cameraPitch += dy * 0.005;
                    cameraPitch = Math.max(-0.2, Math.min(1.2, cameraPitch));
                    lastTouchX = touch.clientX;
                    lastTouchY = touch.clientY;
                }
            }
        });

        const resetLook = (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === lookTouchId) lookTouchId = null;
            }
        };
        touchLookZone.addEventListener('touchend', resetLook);
        touchLookZone.addEventListener('touchcancel', resetLook);

        // Butoane Tactile Action
        btnJump.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!inCar && isGrounded) {
                playerVelY = 0.2;
                isGrounded = false;
            }
        });

        btnCar.addEventListener('touchstart', (e) => {
            e.preventDefault();
            toggleCar();
        });

        // --- Logică Intrare/Ieșire Mașină ---
        function toggleCar() {
            if (inCar) {
                // Ieși din mașină
                inCar = false;
                playerGroup.visible = true;
                playerGroup.position.set(carGroup.position.x + 2.5, 0, carGroup.position.z);
                document.getElementById('status-text').innerText = "Stare: Pe picioare";
                btnCar.innerText = "CAR";
                btnJump.style.display = "flex";
            } else {
                // Intră în mașină dacă ești aproape
                const dist = playerGroup.position.distanceTo(carGroup.position);
                if (dist < 4.0) {
                    inCar = true;
                    playerGroup.visible = false;
                    document.getElementById('status-text').innerText = "Stare: La volan";
                    btnCar.innerText = "EXIT";
                    btnJump.style.display = "none";
                }
            }
        }

        // --- Loop Principal (Game Loop) ---
        function animate() {
            requestAnimationFrame(animate);

            // Verificare distanță până la mașină pentru afișat butonul pe mobil
            const distToCar = playerGroup.position.distanceTo(carGroup.position);
            if (!inCar && distToCar < 4.0) {
                btnCar.style.display = "flex";
            } else if (!inCar) {
                btnCar.style.display = "none";
            } else {
                btnCar.style.display = "flex";
            }

            if (!inCar) {
                // --- Mișcare Jucător ---
                let speed = 0.15;
                let moveX = 0, moveZ = 0;

                // Controale PC (WASD)
                if (keys['KeyW'] || keys['ArrowUp']) moveZ -= 1;
                if (keys['KeyS'] || keys['ArrowDown']) moveZ += 1;
                if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
                if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

                // Combinare Tastatură + Mobil
                if (Math.abs(moveForward) > 0.1) moveZ = -moveForward;
                if (Math.abs(moveSide) > 0.1) moveX = moveSide;

                if (moveX !== 0 || moveZ !== 0) {
                    const moveVector = new THREE.Vector3(moveX, 0, moveZ).normalize();
                    moveVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraYaw);

                    playerGroup.position.x += moveVector.x * speed;
                    playerGroup.position.z += moveVector.z * speed;

                    // Rotire jucător în direcția de mers
                    const angle = Math.atan2(moveVector.x, moveVector.z);
                    playerGroup.rotation.y = angle;
                }

                // Gravitație și Săritură
                playerGroup.position.y += playerVelY;
                if (playerGroup.position.y > 0) {
                    playerVelY -= 0.01;
                } else {
                    playerGroup.position.y = 0;
                    playerVelY = 0;
                    isGrounded = true;
                }

                // Camera Urmărește Jucătorul (Third-Person)
                const camDist = 6;
                camera.position.x = playerGroup.position.x + camDist * Math.sin(cameraYaw) * Math.cos(cameraPitch);
                camera.position.z = playerGroup.position.z + camDist * Math.cos(cameraYaw) * Math.cos(cameraPitch);
                camera.position.y = playerGroup.position.y + 1.8 + camDist * Math.sin(cameraPitch);
                camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.2, playerGroup.position.z);

            } else {
                // --- Control Mașină ---
                let accel = 0;
                let turn = 0;

                if (keys['KeyW'] || keys['ArrowUp']) accel = 0.015;
                if (keys['KeyS'] || keys['ArrowDown']) accel = -0.01;
                if (keys['KeyA'] || keys['ArrowLeft']) turn = 0.03;
                if (keys['KeyD'] || keys['ArrowRight']) turn = -0.03;

                // Mobil Control Mașină
                if (Math.abs(moveForward) > 0.1) accel = moveForward * 0.015;
                if (Math.abs(moveSide) > 0.1) turn = -moveSide * 0.03;

                carSpeed += accel;
                carSpeed *= 0.96; // Frecare cu solul

                carGroup.rotation.y += turn * (carSpeed * 2);
                carGroup.translateZ(carSpeed);

                // Camera Urmărește Mașina
                const camDist = 9;
                camera.position.x = carGroup.position.x - camDist * Math.sin(carGroup.rotation.y);
                camera.position.z = carGroup.position.z - camDist * Math.cos(carGroup.rotation.y);
                camera.position.y = carGroup.position.y + 3.5;
                camera.lookAt(carGroup.position.x, carGroup.position.y + 1, carGroup.position.z);
            }

            renderer.render(scene, camera);
        }

        // Redimensionare Fereastră
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Pornire joc
        animate();
    </script>
</body>
</html>
