<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GTA TEMU - Advanced Inventory & Shop</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* --- Ecran Autentificare --- */
        #auth-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex; align-items: center; justify-content: center;
            z-index: 200;
        }
        .auth-card {
            background: rgba(15, 15, 20, 0.95);
            border: 2px solid #00ffcc;
            padding: 40px; border-radius: 16px; text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3); width: 350px;
        }
        .auth-card h1 { color: #00ffcc; margin-bottom: 20px; font-size: 28px; letter-spacing: 3px; }
        .auth-card input {
            width: 100%; padding: 12px; margin-bottom: 20px;
            background: #111; border: 1px solid #00ffcc; color: #fff;
            border-radius: 8px; font-size: 16px; text-align: center; outline: none;
        }
        .auth-card button {
            width: 100%; padding: 12px; background: #00ffcc; border: none;
            color: #000; font-weight: bold; border-radius: 8px; font-size: 16px; cursor: pointer;
        }

        /* --- UI Joc --- */
        #game-container { width: 100%; height: 100%; position: relative; display: none; }
        #hud {
            position: absolute; top: 20px; left: 20px; color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9); pointer-events: none; z-index: 10;
        }
        #hud h2 { font-size: 24px; color: #00ffcc; }
        #money-display { font-size: 19px; color: #2ecc71; font-weight: bold; }
        #weapon-display { font-size: 15px; color: #f1c40f; margin-top: 4px; }

        /* --- Bară Quick Slots (1, 2, 3) Jos pe Ecran --- */
        #quick-bar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px; z-index: 30; background: rgba(0,0,0,0.6);
            padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(0,255,204,0.4);
            backdrop-filter: blur(5px);
        }
        .quick-slot {
            width: 60px; height: 60px; background: rgba(20, 20, 25, 0.8);
            border: 2px solid #444; border-radius: 8px; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 11px; font-weight: bold; position: relative; cursor: pointer;
        }
        .quick-slot.active { border-color: #00ffcc; box-shadow: 0 0 10px rgba(0,255,204,0.6); }
        .slot-key { position: absolute; top: 2px; left: 5px; color: #888; font-size: 10px; }

        /* --- UI Modale (Inventar & Shop) --- */
        .modal-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 100;
            align-items: center; justify-content: center;
        }
        .window-box {
            background: rgba(15, 15, 22, 0.95); border: 2px solid #00ffcc;
            border-radius: 16px; padding: 25px; width: 480px; color: #fff;
            box-shadow: 0 0 30px rgba(0,255,204,0.3); position: relative;
        }
        .window-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .window-header h2 { color: #00ffcc; }
        .btn-nav {
            background: #00ffcc; color: #000; border: none; padding: 6px 14px;
            font-weight: bold; border-radius: 6px; cursor: pointer;
        }

        /* Grid Inventar */
        .inv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
        .inv-slot {
            width: 100%; height: 80px; background: rgba(255,255,255,0.05);
            border: 1px dashed #555; border-radius: 8px; display: flex;
            align-items: center; justify-content: center; font-size: 12px; text-align: center;
            cursor: grab; position: relative;
        }
        .inv-item {
            width: 90%; height: 90%; background: rgba(0,255,204,0.15);
            border: 1px solid #00ffcc; border-radius: 6px; display: flex;
            align-items: center; justify-content: center; font-weight: bold; color: #fff;
            font-size: 12px; cursor: grab;
        }

        /* Lista Shop */
        .shop-list { display: flex; flex-direction: column; gap: 12px; }
        .shop-row {
            background: rgba(255,255,255,0.05); border: 1px solid #333;
            padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;
        }
        .shop-row button {
            background: #2ecc71; border: none; color: #fff; padding: 8px 16px;
            font-weight: bold; border-radius: 6px; cursor: pointer;
        }

        /* Mobil UI Buttons */
        .mobile-controls { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px;
            background: rgba(255,255,255,0.15); border: 2px solid rgba(0, 255, 204, 0.4);
            border-radius: 50%; pointer-events: auto; backdrop-filter: blur(4px);
        }
        #joystick-knob {
            position: absolute; top: 40px; left: 40px; width: 50px; height: 50px;
            background: rgba(0, 255, 204, 0.8); border-radius: 50%;
        }
        #touch-look-zone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; }
        .action-buttons { position: absolute; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 12px; pointer-events: auto; }
        .btn {
            width: 60px; height: 60px; background: rgba(0, 0, 0, 0.7); border: 2px solid #00ffcc;
            color: #fff; border-radius: 50%; font-weight: bold; font-size: 12px;
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        #btn-car { background: rgba(230, 126, 34, 0.85); display: none; }
        #btn-jump { background: rgba(46, 204, 113, 0.85); }
        #btn-inv { background: rgba(155, 89, 182, 0.85); }
        #btn-shop { background: rgba(52, 152, 219, 0.85); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <!-- Ecran Autentificare -->
    <div id="auth-screen">
        <div class="auth-card">
            <h1>GTA TEMU</h1>
            <input type="text" id="username-input" placeholder="Nume jucător..." maxlength="15">
            <button id="start-game-btn">INTRĂ ÎN JOC</button>
        </div>
    </div>

    <!-- Container Joc -->
    <div id="game-container">
        <div id="hud">
            <h2 id="player-hud-name">Jucător</h2>
            <div id="money-display">Bani: $1000</div>
            <div id="weapon-display">Armă Echipată: Fără</div>
        </div>

        <!-- Quick Slots (Bară 1, 2, 3) -->
        <div id="quick-bar">
            <div class="quick-slot" id="qslot-1" onclick="equipSlot(1)" ondragover="allowDrop(event)" ondrop="dropToSlot(event, 1)">
                <span class="slot-key">1</span>
                <span class="slot-name" id="qname-1">GOL</span>
            </div>
            <div class="quick-slot" id="qslot-2" onclick="equipSlot(2)" ondragover="allowDrop(event)" ondrop="dropToSlot(event, 2)">
                <span class="slot-key">2</span>
                <span class="slot-name" id="qname-2">GOL</span>
            </div>
            <div class="quick-slot" id="qslot-3" onclick="equipSlot(3)" ondragover="allowDrop(event)" ondrop="dropToSlot(event, 3)">
                <span class="slot-key">3</span>
                <span class="slot-name" id="qname-3">GOL</span>
            </div>
        </div>

        <!-- Modal Inventar Modern -->
        <div class="modal-overlay" id="inv-modal">
            <div class="window-box">
                <div class="window-header">
                    <h2>INVENTARUL TĂU</h2>
                    <div>
                        <button class="btn-nav" onclick="openShopModal()">MAGAZIN / SHOP</button>
                        <button style="background:#e74c3c; border:none; color:#fff; padding:6px 12px; font-weight:bold; border-radius:6px; cursor:pointer;" onclick="closeModals()">X</button>
                    </div>
                </div>
                <p style="font-size:12px; color:#aaa; margin-bottom:15px;">Trage arma cu mouse-ul pe sloturile 1, 2 sau 3 din josul ecranului!</p>
                <div class="inv-grid" id="inv-grid">
                    <!-- Sloturi generate dinamic -->
                </div>
            </div>
        </div>

        <!-- Modal Magazin / Shop -->
        <div class="modal-overlay" id="shop-modal">
            <div class="window-box">
                <div class="window-header">
                    <h2>MAGAZIN ARME</h2>
                    <div>
                        <button class="btn-nav" onclick="openInvModal()">INVENTAR</button>
                        <button style="background:#e74c3c; border:none; color:#fff; padding:6px 12px; font-weight:bold; border-radius:6px; cursor:pointer;" onclick="closeModals()">X</button>
                    </div>
                </div>
                <div class="shop-list">
                    <div class="shop-row">
                        <span>Pistol 9mm - $200</span>
                        <button onclick="buyWeapon('Pistol', 200)">CUMPĂRĂ</button>
                    </div>
                    <div class="shop-row">
                        <span>Pușcă de Asalt - $500</span>
                        <button onclick="buyWeapon('Pușcă', 500)">CUMPĂRĂ</button>
                    </div>
                    <div class="shop-row">
                        <span>Bazooka RPG - $1000</span>
                        <button onclick="buyWeapon('Bazooka', 1000)">CUMPĂRĂ</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mobil UI -->
        <div class="mobile-controls" id="mobile-ui">
            <div id="joystick-zone"><div id="joystick-knob"></div></div>
            <div id="touch-look-zone"></div>
            <div class="action-buttons">
                <div class="btn" id="btn-shop" onclick="openShopModal()">SHOP</div>
                <div class="btn" id="btn-inv" onclick="openInvModal()">INV</div>
                <div class="btn" id="btn-car">CAR</div>
                <div class="btn" id="btn-jump">JUMP</div>
            </div>
        </div>
    </div>

    <script>
        // Data Game User & Inventory
        let playerData = JSON.parse(localStorage.getItem('gta_temu_v3')) || null;
        let inventory = playerData ? (playerData.inventory || []) : [];
        let quickSlots = playerData ? (playerData.quickSlots || { 1: null, 2: null, 3: null }) : { 1: null, 2: null, 3: null };
        let activeSlot = 1;

        const authScreen = document.getElementById('auth-screen');
        const gameContainer = document.getElementById('game-container');
        const usernameInput = document.getElementById('username-input');
        const startGameBtn = document.getElementById('start-game-btn');
        const moneyDisplay = document.getElementById('money-display');
        const weaponDisplay = document.getElementById('weapon-display');

        if (playerData) usernameInput.value = playerData.name;

        startGameBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim() || 'Jucător';
            if (!playerData) playerData = { name: name, money: 1000 };
            playerData.name = name;
            playerData.inventory = inventory;
            playerData.quickSlots = quickSlots;
            saveData();

            document.getElementById('player-hud-name').innerText = playerData.name;
            updateUI();
            authScreen.style.display = 'none';
            gameContainer.style.display = 'block';
            initGame();
        });

        function saveData() {
            playerData.inventory = inventory;
            playerData.quickSlots = quickSlots;
            localStorage.setItem('gta_temu_v3', JSON.stringify(playerData));
        }

        function updateUI() {
            moneyDisplay.innerText = `Bani: $${playerData.money}`;
            for (let i = 1; i <= 3; i++) {
                document.getElementById(`qname-${i}`).innerText = quickSlots[i] || 'GOL';
                document.getElementById(`qslot-${i}`).classList.toggle('active', activeSlot === i);
            }
            weaponDisplay.innerText = `Armă Echipată: ${quickSlots[activeSlot] || 'Fără'}`;
            renderInventoryGrid();
        }

        // Drag and Drop Sistem
        function renderInventoryGrid() {
            const grid = document.getElementById('inv-grid');
            grid.innerHTML = '';
            for (let i = 0; i < 8; i++) {
                const slot = document.createElement('div');
                slot.className = 'inv-slot';
                if (inventory[i]) {
                    const item = document.createElement('div');
                    item.className = 'inv-item';
                    item.innerText = inventory[i];
                    item.draggable = true;
                    item.ondragstart = (e) => e.dataTransfer.setData("text/plain", inventory[i]);
                    slot.appendChild(item);
                }
                grid.appendChild(slot);
            }
        }

        function allowDrop(e) { e.preventDefault(); }
        function dropToSlot(e, slotNum) {
            e.preventDefault();
            const weaponName = e.dataTransfer.getData("text/plain");
            if (weaponName) {
                quickSlots[slotNum] = weaponName;
                saveData();
                updateUI();
            }
        }

        function equipSlot(slotNum) {
            activeSlot = slotNum;
            updateUI();
        }

        function openInvModal() {
            closeModals();
            document.getElementById('inv-modal').style.display = 'flex';
        }
        function openShopModal() {
            closeModals();
            document.getElementById('shop-modal').style.display = 'flex';
        }
        function closeModals() {
            document.getElementById('inv-modal').style.display = 'none';
            document.getElementById('shop-modal').style.display = 'none';
        }

        function buyWeapon(name, price) {
            if (playerData.money >= price) {
                playerData.money -= price;
                inventory.push(name);
                // Auto-echipare dacă există slot gol
                for (let i = 1; i <= 3; i++) {
                    if (!quickSlots[i]) { quickSlots[i] = name; break; }
                }
                saveData();
                updateUI();
                alert(`Ai cumpărat ${name}! Se află în inventar.`);
            } else {
                alert("Nu ai suficienți bani!");
            }
        }

        // Key Listeners pentru Quick Slots (1, 2, 3) & Inventar (I)
        window.addEventListener('keydown', e => {
            if (e.code === 'KeyI') {
                const invOpen = document.getElementById('inv-modal').style.display === 'flex';
                if (invOpen) closeModals(); else openInvModal();
            }
            if (e.code === 'Digit1') equipSlot(1);
            if (e.code === 'Digit2') equipSlot(2);
            if (e.code === 'Digit3') equipSlot(3);
        });

        // --- GAME ENGINE 3D ---
        function initGame() {
            const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            if (isMobile) document.getElementById('mobile-ui').style.display = 'block';

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a12);
            scene.fog = new THREE.FogExp2(0x0a0a12, 0.005);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const sunLight = new THREE.DirectionalLight(0xfffaed, 0.8);
            sunLight.position.set(100, 200, 100);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // Hartă & Sol
            const mapSize = 800;
            const floorGeo = new THREE.PlaneGeometry(mapSize, mapSize);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Clădiri & Coliziuni
            const buildings = [];
            const buildingGeo = new THREE.BoxGeometry(1, 1, 1);
            const buildingMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });

            for (let x = -350; x <= 350; x += 60) {
                for (let z = -350; z <= 350; z += 60) {
                    if (Math.abs(x) < 40 && Math.abs(z) < 40) continue;
                    const h = 25 + Math.random() * 50;
                    const b = new THREE.Mesh(buildingGeo, buildingMat);
                    b.scale.set(25, h, 25);
                    b.position.set(x, h/2, z);
                    b.castShadow = true; b.receiveShadow = true;
                    scene.add(b);
                    buildings.push(new THREE.Box3().setFromObject(b));
                }
            }

            function checkCollision(pos, radius = 0.7) {
                if (Math.abs(pos.x) > mapSize/2 - 10 || Math.abs(pos.z) > mapSize/2 - 10) return true;
                for (let b of buildings) {
                    if (pos.x + radius > b.min.x && pos.x - radius < b.max.x &&
                        pos.z + radius > b.min.z && pos.z - radius < b.max.z) return true;
                }
                return false;
            }

            // Character
            const playerGroup = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.9, 0.35), new THREE.MeshStandardMaterial({ color: 0x00ffcc }));
            body.position.y = 1.05;
            playerGroup.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.22), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
            head.position.y = 1.65;
            playerGroup.add(head);
            playerGroup.position.set(0, 0, 10);
            scene.add(playerGroup);

            // NPC-uri
            const npcs = [];
            for (let i = 0; i < 35; i++) {
                const npc = playerGroup.clone();
                npc.position.set((Math.random()-0.5)*500, 0, (Math.random()-0.5)*500);
                scene.add(npc);
                npcs.push({ mesh: npc, dir: new THREE.Vector3(Math.random()-0.5, 0, Math.random()-0.5).normalize(), alive: true });
            }

            // Proiectile / Gloanțe Infinite
            const bullets = [];
            function shootBullet() {
                const currentWeapon = quickSlots[activeSlot];
                if (!currentWeapon) return;

                const bulletGeo = new THREE.SphereGeometry(0.15, 8, 8);
                const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
                const bullet = new THREE.Mesh(bulletGeo, bulletMat);
                
                bullet.position.set(playerGroup.position.x, 1.2, playerGroup.position.z);
                const dir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerGroup.rotation.y);
                
                scene.add(bullet);
                bullets.push({ mesh: bullet, dir: dir, speed: 1.2, life: 100 });
            }

            // Click pentru shoot
            renderer.domElement.addEventListener('click', () => {
                if (!isMobile && document.pointerLockElement === renderer.domElement) {
                    shootBullet();
                } else if (!isMobile) {
                    renderer.domElement.requestPointerLock();
                }
            });

            // Input
            const keys = {};
            let cameraYaw = 0, cameraPitch = 0.25;
            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);

            document.addEventListener('mousemove', e => {
                if (document.pointerLockElement === renderer.domElement) {
                    cameraYaw -= e.movementX * 0.003;
                    cameraPitch += e.movementY * 0.003;
                    cameraPitch = Math.max(-0.2, Math.min(1.2, cameraPitch));
                }
            });

            // Loop
            function animate() {
                requestAnimationFrame(animate);

                // Update Gloanțe
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    b.mesh.position.addScaledVector(b.dir, b.speed);
                    b.life--;

                    // Impact NPC
                    npcs.forEach(npc => {
                        if (npc.alive && b.mesh.position.distanceTo(npc.mesh.position) < 1.2) {
                            npc.alive = false;
                            scene.remove(npc.mesh);
                            playerData.money += 150;
                            saveData();
                            updateUI();
                        }
                    });

                    if (b.life <= 0) {
                        scene.remove(b.mesh);
                        bullets.splice(i, 1);
                    }
                }

                // Mișcare Jucător
                let moveX = 0, moveZ = 0;
                if (keys['KeyW']) moveZ -= 1;
                if (keys['KeyS']) moveZ += 1;
                if (keys['KeyA']) moveX -= 1;
                if (keys['KeyD']) moveX += 1;

                if (moveX !== 0 || moveZ !== 0) {
                    const moveVector = new THREE.Vector3(moveX, 0, moveZ).normalize();
                    moveVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraYaw);

                    const nextP = playerGroup.position.clone().addScaledVector(moveVector, 0.18);
                    if (!checkCollision(nextP)) playerGroup.position.copy(nextP);
                    playerGroup.rotation.y = Math.atan2(moveVector.x, moveVector.z);
                }

                // Camera Follow
                const camDist = 6.5;
                camera.position.x = playerGroup.position.x + camDist * Math.sin(cameraYaw) * Math.cos(cameraPitch);
                camera.position.z = playerGroup.position.z + camDist * Math.cos(cameraYaw) * Math.cos(cameraPitch);
                camera.position.y = playerGroup.position.y + 1.8 + camDist * Math.sin(cameraPitch);
                camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.2, playerGroup.position.z);

                renderer.render(scene, camera);
            }

            animate();
        }
    </script>
</body>
</html>
